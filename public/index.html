<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task List</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #5c6370;
    --line: #dfe2e8; --elec: #2563c9; --mech: #c8501e; --done: #2f7d4f; --on: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121316; --card: #1c1e23; --text: #eceef2; --muted: #9aa1ae; --line: #2c2f36;
            --elec: #6ea8ff; --mech: #ff8a57; --done: #5fc088; --on: #0f1114; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header { padding: 20px 16px 8px; max-width: 760px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.5rem; }
  .sub { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 40px; }

  section.group { margin-top: 28px; }
  section.group > h2 {
    margin: 0 0 4px; font-size: 1.2rem; display: flex; align-items: baseline; gap: 10px;
    padding-left: 10px; border-left: 5px solid var(--cat);
  }
  section.group > h2 .count { color: var(--muted); font-size: .9rem; font-weight: 500; }
  section.group.electrical { --cat: var(--elec); }
  section.group.mechanical { --cat: var(--mech); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin: 12px 0; padding: 14px; overflow: hidden;
  }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .num {
    flex: none; min-width: 2.9em; height: 2.4em; padding: 0 .6em; border-radius: 1.2em;
    background: var(--cat); color: var(--on); font-weight: 700; white-space: nowrap;
    display: flex; align-items: center; justify-content: center;
  }
  .loc { font-weight: 650; }
  .desc { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .imgs { display: grid; gap: 8px; margin-top: 12px; grid-template-columns: 1fr; }
  .imgs.multi { grid-template-columns: 1fr 1fr; }
  .imgs a { display: block; }
  .imgs img {
    width: 100%; height: auto; display: block; border-radius: 8px;
    background: var(--line); aspect-ratio: 4 / 3; object-fit: cover;
  }
  .imgs.multi img { aspect-ratio: 1 / 1; }
  .note { color: var(--muted); padding: 12px 2px; }
  .note.center { text-align: center; padding: 24px 0; }

  details.done-group { margin-top: 16px; }
  details.done-group > summary {
    cursor: pointer; list-style: none; padding: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    font-weight: 650; display: flex; align-items: center; gap: 10px;
    min-height: 48px; -webkit-tap-highlight-color: transparent;
  }
  details.done-group > summary::-webkit-details-marker { display: none; }
  details.done-group > summary::before {
    content: ""; width: .55em; height: .55em; flex: none;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s;
  }
  details.done-group[open] > summary::before { transform: rotate(45deg); }
  details.done-group > summary .count { color: var(--muted); font-weight: 500; }
  .card.done .num { background: var(--done); }
  .card.done .loc, .card.done .desc { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">Task List</h1>
  <div class="sub" id="sub"></div>
</header>
<main id="list"><div class="note center">Loading…</div></main>

<script>
(async function () {
  var list = document.getElementById('list');
  var GROUPS = [
    { key: 'electrical', label: 'Electrical' },
    { key: 'mechanical', label: 'Mechanical' }
  ];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function makeCard(t, isDone) {
    var card = el('article', 'card' + (isDone ? ' done' : ''));
    var top = el('div', 'top');
    top.appendChild(el('div', 'num', isDone ? t.id + ' ✓' : t.id));
    var body = el('div');
    body.appendChild(el('div', 'loc', t.location || ''));
    body.appendChild(el('div', 'desc', t.description || ''));
    top.appendChild(body);
    card.appendChild(top);

    var imgs = t.images || [];
    if (imgs.length) {
      var grid = el('div', 'imgs' + (imgs.length > 1 ? ' multi' : ''));
      imgs.forEach(function (src) {
        var a = el('a'); a.href = src; a.target = '_blank'; a.rel = 'noopener';
        var im = el('img'); im.src = src; im.loading = 'lazy';
        im.alt = 'Item ' + t.id + (t.location ? ' – ' + t.location : '');
        a.appendChild(im); grid.appendChild(a);
      });
      card.appendChild(grid);
    }
    return card;
  }

  try {
    var res = await fetch('tasks.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    var data = await res.json();
    var tasks = data.tasks || [];

    if (data.title) { el('x'); document.getElementById('title').textContent = data.title; document.title = data.title; }
    var totalOpen = tasks.filter(function (t) { return !t.done; }).length;
    var totalDone = tasks.length - totalOpen;
    var sub = [];
    if (data.subtitle) sub.push(data.subtitle);
    if (data.updated) sub.push('Updated ' + data.updated);
    sub.push(totalOpen + ' open' + (totalDone ? ' · ' + totalDone + ' done' : ''));
    document.getElementById('sub').textContent = sub.join(' · ');

    list.textContent = '';
    GROUPS.forEach(function (g) {
      var items = tasks.filter(function (t) { return t.category === g.key; });
      if (!items.length) return;
      var open = items.filter(function (t) { return !t.done; });
      var done = items.filter(function (t) { return t.done; });

      var sec = el('section', 'group ' + g.key);
      var h = el('h2', null, g.label + ' ');
      h.appendChild(el('span', 'count', open.length + ' open'));
      sec.appendChild(h);

      open.forEach(function (t) { sec.appendChild(makeCard(t, false)); });
      if (!open.length) sec.appendChild(el('div', 'note', 'No open items.'));

      if (done.length) {
        var det = el('details', 'done-group');
        var sum = el('summary', null, 'Completed ');
        sum.appendChild(el('span', 'count', '(' + done.length + ')'));
        det.appendChild(sum);
        done.forEach(function (t) { det.appendChild(makeCard(t, true)); });
        sec.appendChild(det);
      }
      list.appendChild(sec);
    });
    if (!list.children.length) list.appendChild(el('div', 'note center', 'No items yet.'));
  } catch (e) {
    list.textContent = '';
    list.appendChild(el('div', 'note center', 'Could not load the task list.'));
  }
})();
</script>
</body>
</html>
